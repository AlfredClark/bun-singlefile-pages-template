<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Counter</h1>
      <p class="value" id="value">0</p>
      <div class="controls">
        <button type="button" id="decrement" aria-label="Decrease">-1</button>
        <button type="button" id="reset">Reset</button>
        <button type="button" id="increment" aria-label="Increase">+1</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
